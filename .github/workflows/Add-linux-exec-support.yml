name: Build e2fstool

on:
  push:
    branches: [ "1.x", "main" ]
  pull_request:
    branches: [ "1.x", "main" ]
  workflow_dispatch:

jobs:
  build-ubuntu:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: 1.x
    
    - name: Install base build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc \
          g++ \
          make \
          cmake \
          pkg-config \
          git \
          e2fslibs-dev \
          libext2fs-dev \
          libcom-err2 \
          comerr-dev \
          zlib1g-dev
    
    - name: Clone Android platform system/core for libsparse
      run: |
        git clone --depth 1 --branch android-10.0.0_r47 \
          https://android.googlesource.com/platform/system/core android-core
    
    - name: Create missing Android headers
      run: |
        # Create the android_filesystem_capability.h header if it doesn't exist
        sudo mkdir -p /usr/local/include/private
        
        cat > /tmp/android_filesystem_capability.h << 'EOF'
        #ifndef ANDROID_FILESYSTEM_CAPABILITY_H
        #define ANDROID_FILESYSTEM_CAPABILITY_H
        
        #include <stdint.h>
        #include <sys/types.h>
        
        #define VFS_CAP_REVISION_MASK   0xFF000000
        #define VFS_CAP_REVISION_SHIFT  24
        #define VFS_CAP_FLAGS_MASK      ~VFS_CAP_REVISION_MASK
        #define VFS_CAP_FLAGS_EFFECTIVE 0x000001
        
        #define VFS_CAP_REVISION_1      0x01000000
        #define VFS_CAP_REVISION_2      0x02000000
        #define VFS_CAP_REVISION        VFS_CAP_REVISION_2
        
        #define XATTR_CAPS_SZ (sizeof(__le32)*(1 + 2*2))
        
        struct vfs_cap_data {
            uint32_t magic_etc;
            struct {
                uint32_t permitted;
                uint32_t inheritable;
            } data[2];
        };
        
        #endif
        EOF
        
        sudo cp /tmp/android_filesystem_capability.h /usr/local/include/private/
    
    - name: Build libsparse from source
      run: |
        cd android-core/libsparse
        
        # Patch output_file.cpp to fix typeof issue
        sed -i 's/typeof/__typeof__/g' output_file.cpp
        
        # Create a simple Makefile for libsparse
        cat > Makefile << 'EOF'
        CC = gcc
        CXX = g++
        CFLAGS = -Wall -O2 -fPIC -Iinclude
        CXXFLAGS = -Wall -O2 -fPIC -Iinclude -std=gnu++11
        
        SOURCES = backed_block.cpp output_file.cpp sparse.cpp sparse_crc32.cpp sparse_err.cpp sparse_read.cpp
        OBJECTS = $(SOURCES:.cpp=.o)
        
        all: libsparse.a libsparse.so
        
        %.o: %.cpp
        	$(CXX) $(CXXFLAGS) -c $< -o $@
        
        libsparse.a: $(OBJECTS)
        	ar rcs $@ $(OBJECTS)
        
        libsparse.so: $(OBJECTS)
        	$(CXX) -shared -o $@ $(OBJECTS) -lz
        
        clean:
        	rm -f $(OBJECTS) libsparse.a libsparse.so
        EOF
        
        # Build the library
        make
        
        # Install to system
        sudo cp libsparse.so /usr/local/lib/
        sudo cp libsparse.a /usr/local/lib/
        sudo mkdir -p /usr/local/include/sparse
        sudo cp include/sparse/*.h /usr/local/include/sparse/
        sudo ldconfig
    
    - name: Clone Android platform system/base for libbase
      run: |
        git clone --depth 1 --branch android-10.0.0_r47 \
          https://android.googlesource.com/platform/system/libbase android-base
    
    - name: Build libbase from source
      run: |
        cd android-base
        
        # Create Makefile for minimal libbase
        cat > Makefile << 'EOF'
        CC = gcc
        CXX = g++
        CXXFLAGS = -Wall -O2 -fPIC -Iinclude -std=c++11 -DNDEBUG
        
        SOURCES = \
          chrono_utils.cpp \
          file.cpp \
          logging.cpp \
          mapped_file.cpp \
          parsenetaddress.cpp \
          quick_exit.cpp \
          stringprintf.cpp \
          strings.cpp \
          threads.cpp \
          test_utils.cpp \
          errors_unix.cpp
        
        OBJECTS = $(SOURCES:.cpp=.o)
        
        all: libbase.a libbase.so
        
        %.o: %.cpp
        	$(CXX) $(CXXFLAGS) -c $< -o $@
        
        libbase.a: $(OBJECTS)
        	ar rcs $@ $(OBJECTS)
        
        libbase.so: $(OBJECTS)
        	$(CXX) -shared -o $@ $(OBJECTS) -lpthread
        
        clean:
        	rm -f $(OBJECTS) libbase.a libbase.so
        EOF
        
        # Build what we can
        make || echo "Some base components failed, continuing..."
        
        # Install headers and whatever built successfully
        sudo mkdir -p /usr/local/include/android-base
        sudo cp -r include/android-base/*.h /usr/local/include/android-base/ || true
        [ -f libbase.so ] && sudo cp libbase.so /usr/local/lib/
        [ -f libbase.a ] && sudo cp libbase.a /usr/local/lib/
        sudo ldconfig
    
    - name: Display compiler versions
      run: |
        gcc --version
        g++ --version
        pkg-config --version
    
    - name: Verify library installation
      run: |
        echo "=== Checking installed libraries ==="
        ldconfig -p | grep libsparse || echo "libsparse not in cache"
        ldconfig -p | grep libbase || echo "libbase not in cache"
        ldconfig -p | grep libext2fs || echo "libext2fs not in cache"
        
        echo -e "\n=== Checking header files ==="
        ls -la /usr/local/include/sparse/ || echo "sparse headers not found"
        ls -la /usr/local/include/android-base/ || echo "base headers not found"
        
        echo -e "\n=== Library files ==="
        ls -la /usr/local/lib/libsparse* || echo "libsparse not found"
        ls -la /usr/local/lib/libbase* || echo "libbase not found"
    
    - name: Create build directory
      run: mkdir -p build
    
    - name: Compile e2fstool
      run: |
        gcc -o build/e2fstool e2fstool.c \
          -I/usr/include \
          -I/usr/local/include \
          -L/usr/local/lib \
          -lext2fs \
          -lcom_err \
          -lsparse \
          -lz \
          -Wall \
          -Wextra \
          -O2 \
          -Wl,-rpath,/usr/local/lib
      continue-on-error: false
    
    - name: Verify build output
      run: |
        if [ -f build/e2fstool ]; then
          echo "✓ Build successful!"
          ls -lh build/e2fstool
          file build/e2fstool
          ldd build/e2fstool
        else
          echo "✗ Build failed - executable not found"
          exit 1
        fi
    
    - name: Test executable
      run: |
        ./build/e2fstool --help || true
        ./build/e2fstool || echo "Expected failure - no arguments provided"
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: e2fstool-${{ matrix.os }}
        path: build/e2fstool
        retention-days: 30
    
    - name: Display build info
      run: |
        echo "=== Build Summary ==="
        echo "OS: ${{ matrix.os }}"
        echo "GCC Version: $(gcc --version | head -n1)"
        echo "Binary Size: $(du -h build/e2fstool | cut -f1)"
        echo "Binary Type: $(file build/e2fstool)"

  build-static:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: 1.x
    
    - name: Install base build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc \
          g++ \
          make \
          cmake \
          pkg-config \
          git \
          e2fslibs-dev \
          libext2fs-dev \
          libcom-err2 \
          comerr-dev \
          zlib1g-dev
    
    - name: Clone and build libsparse
      run: |
        # Create missing Android headers
        sudo mkdir -p /usr/local/include/private
        cat > /tmp/android_filesystem_capability.h << 'EOF'
        #ifndef ANDROID_FILESYSTEM_CAPABILITY_H
        #define ANDROID_FILESYSTEM_CAPABILITY_H
        #include <stdint.h>
        #include <sys/types.h>
        #define VFS_CAP_REVISION_MASK   0xFF000000
        #define VFS_CAP_REVISION_SHIFT  24
        #define VFS_CAP_FLAGS_MASK      ~VFS_CAP_REVISION_MASK
        #define VFS_CAP_FLAGS_EFFECTIVE 0x000001
        #define VFS_CAP_REVISION_1      0x01000000
        #define VFS_CAP_REVISION_2      0x02000000
        #define VFS_CAP_REVISION        VFS_CAP_REVISION_2
        #define XATTR_CAPS_SZ (sizeof(__le32)*(1 + 2*2))
        struct vfs_cap_data {
            uint32_t magic_etc;
            struct {
                uint32_t permitted;
                uint32_t inheritable;
            } data[2];
        };
        #endif
        EOF
        sudo cp /tmp/android_filesystem_capability.h /usr/local/include/private/
        
        # Clone and build libsparse
        git clone --depth 1 --branch android-10.0.0_r47 \
          https://android.googlesource.com/platform/system/core android-core
        cd android-core/libsparse
        
        # Patch output_file.cpp to fix typeof issue
        sed -i 's/typeof/__typeof__/g' output_file.cpp
        
        cat > Makefile << 'EOF'
        CC = gcc
        CXX = g++
        CFLAGS = -Wall -O2 -fPIC -Iinclude
        CXXFLAGS = -Wall -O2 -fPIC -Iinclude -std=gnu++11
        SOURCES = backed_block.cpp output_file.cpp sparse.cpp sparse_crc32.cpp sparse_err.cpp sparse_read.cpp
        OBJECTS = $(SOURCES:.cpp=.o)
        all: libsparse.a libsparse.so
        %.o: %.cpp
        	$(CXX) $(CXXFLAGS) -c $< -o $@
        libsparse.a: $(OBJECTS)
        	ar rcs $@ $(OBJECTS)
        libsparse.so: $(OBJECTS)
        	$(CXX) -shared -o $@ $(OBJECTS) -lz
        EOF
        
        make
        sudo cp libsparse.a /usr/local/lib/
        sudo cp libsparse.so /usr/local/lib/
        sudo mkdir -p /usr/local/include/sparse
        sudo cp include/sparse/*.h /usr/local/include/sparse/
        sudo ldconfig
    
    - name: Attempt static build
      continue-on-error: true
      run: |
        mkdir -p build
        gcc -o build/e2fstool-static e2fstool.c \
          -I/usr/include \
          -I/usr/local/include \
          -L/usr/local/lib \
          -static \
          -lext2fs \
          -lcom_err \
          /usr/local/lib/libsparse.a \
          -lz \
          -lpthread \
          -Wall \
          -Wextra \
          -O2
    
    - name: Check if static build succeeded
      id: check_static
      run: |
        if [ -f build/e2fstool-static ]; then
          echo "static_built=true" >> $GITHUB_OUTPUT
          ls -lh build/e2fstool-static
          file build/e2fstool-static
        else
          echo "static_built=false" >> $GITHUB_OUTPUT
          echo "Static build was not successful"
        fi
    
    - name: Upload static build if successful
      if: steps.check_static.outputs.static_built == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: e2fstool-static-ubuntu-22.04
        path: build/e2fstool-static
        retention-days: 30

  create-release:
    needs: [build-ubuntu, build-static]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/1.x'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Display artifacts
      run: |
        find artifacts -type f -name "e2fstool*" -exec ls -lh {} \;
    
    - name: Create tarball
      run: |
        cd artifacts
        tar -czf e2fstool-linux-builds.tar.gz */e2fstool* 2>/dev/null || \
          tar -czf e2fstool-linux-builds.tar.gz **/e2fstool* 2>/dev/null || \
          echo "No artifacts to package"
        cd ..
        if [ -f artifacts/e2fstool-linux-builds.tar.gz ]; then
          mv artifacts/e2fstool-linux-builds.tar.gz .
        fi
    
    - name: Upload combined artifact
      if: hashFiles('e2fstool-linux-builds.tar.gz') != ''
      uses: actions/upload-artifact@v4
      with:
        name: e2fstool-all-builds
        path: e2fstool-linux-builds.tar.gz
        retention-days: 90
